[project]
name = "citu-gigworkers-backend"
version = "0.1.0"
description = "Backend API for Kerala State Gig & Platform Workers Union (CITU)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litestar[standard]>=2.15.0",
    "granian[reload]>=1.7.0",
    "msgspec>=0.19.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "pillow>=11.0.0",
    "segno>=1.6.0",
    "procrastinate[sqlalchemy]>=3.0.0",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.18"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
