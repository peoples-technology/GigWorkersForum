server {
    listen 80;
    server_name gigworkers.citu.org.in www.gigworkers.citu.org.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gigworkers.citu.org.in;

    # SSL Certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/gigworkers.citu.org.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gigworkers.citu.org.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers (DPDP & OWASP Hardening)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; script-src 'self' 'unsafe-inline'; connect-src 'self';" always;

    # SvelteKit Static PWA Build
    root /var/www/citu-gigworkers/frontend/build;
    index index.html;

    # Frontend Routing
    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Static Assets Cache
    location /_app/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Litestar API Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Protected Uploads (X-Accel-Redirect only)
    location /protected/uploads/ {
        internal;
        alias /var/lib/citu-gigworkers/uploads/;
    }
}
